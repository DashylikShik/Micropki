<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <defs><style>.box{fill:#eef6ff;stroke:#1f4e79;stroke-width:2;rx:10}.store{fill:#fff8dc;stroke:#8a6d3b;stroke-width:2}.txt{font-family:Arial,sans-serif;font-size:16px}.title{font-size:22px;font-weight:bold}.small{font-size:13px}.arrow{stroke:#333;stroke-width:2;marker-end:url(#m)} </style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
  <text x="390" y="34" class="title">MicroPKI Architecture</text>
  <rect x="40" y="70" width="150" height="70" class="box"/><text x="78" y="100" class="txt">CLI</text><text x="60" y="122" class="small">ca/client/audit</text>
